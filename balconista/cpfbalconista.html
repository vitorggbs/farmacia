<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FarmaCerta - Identificação</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../assets/LOGO_2.png">
</head>

<body class="login-body">

    <div class="login-card">

        <h1>FarmaCerta</h1>

        <div class="logo-farmacia">
            <img src="../assets/LOGO_2.png" alt="Logo FarmaCerta">
        </div>

        <label for="cpf">CPF DO BALCONISTA</label>

        <input
            type="text"
            id="cpf"
            maxlength="14"
            placeholder="000.000.000-00"
            oninput="formatarCPF(this)"
        >

        <button type="button" onclick="entrarBalconista()">
            ENTRAR
        </button>

        <p id="mensagem-login" class="mensagem-login"></p>

    </div>


    <script>

        function formatarCPF(campo) {

            var cpf = campo.value;

            cpf = cpf.replace(/\D/g, "");

            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            campo.value = cpf;
        }


        function entrarBalconista() {

            var cpf = document.getElementById("cpf").value;
            var mensagem = document.getElementById("mensagem-login");

            mensagem.innerHTML = "";

            if (cpf === "") {

                mensagem.innerHTML = "Digite o CPF do balconista.";

                return;
            }


            if (cpf.length !== 14) {

                mensagem.innerHTML = "Digite um CPF válido.";

                return;
            }


            // Guarda o CPF
            localStorage.setItem("cpfBalconista", cpf);

            // Vai para o painel
            window.location.href = "iniciobalconista.html";
        }

    </script>

</body>
</html>
