<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmaCerta - Produtos</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../assets/LOGO_2.png">
</head>

<body>
<header class="topo">
    <img src="../assets/LOGO_1.png"
         alt="foto da empresa"
         width="200"
         height="auto">

    <h1>Sistema de Gestão</h1>
    <div class="usuario-topo">
        <span>Farmácia: farmacia1</span>
        <span>
            Balconista:
            <strong id="cpf-balconista"></strong>
        </span>
        <a class="logout" href="#" onclick="sair()">
            SAIR
        </a>
    </div>
</header>


<nav class="menu">
    <a href="iniciobalconista.html">
        INÍCIO
    </a>
    <a href="produtosbalconista.html" class="ativo">
        PRODUTOS
    </a>
    <a href="carrinhobalconista.php">
        CARRINHO (2)
    </a>
    <a href="historicorecibobalconista.html">
        HISTÓRICO
    </a>
</nav>
<main class="container">
<div class="card">
    <div class="cabecalho-card">
        <h2>PRODUTOS CADASTRADOS</h2>
        <input
            class="busca-produtos"
            type="text"
            id="busca"
            placeholder="Buscar produto..."
            onkeyup="buscarProduto()"
        >
    </div>
    <table class="tabela" id="tabela-produtos">
        <tr>
            <th>Foto</th>
            <th>Produto</th>
            <th>Valor</th>
            <th>Estoque</th>
            <th>Prateleira</th>
            <th>Comprar</th>
        </tr>
        <tr>
            <td>
                <div class="foto-exemplo"></div>
            </td>
            <td>Dipirona</td>
            <td>R$ 12,50</td>
            <td>15</td>
            <td>B5</td>
            <td>
                <input
                    type="number"
                    value="1"
                    min="1"
                    max="15"
                >
                <button>
                    ADICIONAR
                </button>
            </td>
        </tr>
        <tr>
            <td>
                <div class="foto-exemplo"></div>
            </td>
            <td>Álcool 70%</td>
            <td>R$ 8,90</td>
            <td>6</td>
            <td>A3</td>
            <td>
                <input
                    type="number"
                    value="1"
                    min="1"
                    max="6"
                >
                <button>
                    ADICIONAR
                </button>
            </td>
        </tr>
        <tr>
            <td>
                <div class="foto-exemplo"></div>
            </td>
            <td>Paracetamol</td>
            <td>R$ 9,00</td>
            <td>
                <span class="sem-estoque">
                    0<br>
                    SEM ESTOQUE
                </span>
            </td>
            <td>C7</td>
            <td>
                <input
                    type="number"
                    value="1"
                    min="1"
                    disabled
                >
                <button disabled>
                    SEM ESTOQUE
                </button>
            </td>
        </tr>
    </table>
</div>
</main>
<script>
    var cpf = localStorage.getItem("cpfBalconista");
    if (cpf === null || cpf === "") {
        window.location.href = "../index.html";
    } else {
        document.getElementById("cpf-balconista").innerHTML = cpf;
    }

    function sair() {
        localStorage.removeItem("cpfBalconista");
        window.location.href = "../index.html";
    }

    function buscarProduto() {
        var busca = document.getElementById("busca").value.toLowerCase();
        var tabela = document.getElementById("tabela-produtos");
        var linhas = tabela.getElementsByTagName("tr");
        for (var i = 1; i < linhas.length; i++) {
            var nomeProduto = linhas[i]
                .getElementsByTagName("td")[1]
                .innerText
                .toLowerCase();
            if (nomeProduto.includes(busca)) {
                linhas[i].style.display = "";
            } else {
                linhas[i].style.display = "none";
            }
        }
    }
</script>
</body>
</html>
