<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FarmaCerta - Cadastrar Produto</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../assets/LOGO_2.png">
</head>

<body>

    <header class="topo">

        <img src="../assets/LOGO_1.png"
             alt="Foto da empresa"
             width="200">

        <h1>FarmaCerta - Gerente</h1>

        <div class="usuario-topo">
            <span>Gerente: farmacia1</span>

            <a class="logout" href="../index.html">
                SAIR
            </a>
        </div>

    </header>


    <nav class="menu">

        <a href="iniciogerente.html">
            INÍCIO
        </a>
        
        <a href="produtosgerente.php">PRODUTOS</a>

        <a href="cadastrargerente.html" class="ativo">
            CADASTRAR PRODUTO
        </a>

        <a href="historicorecibogerente.html">
            RECIBOS
        </a>

    </nav>


    <main class="container">

        <div class="card">

            <h2>CADASTRAR PRODUTO</h2>

            <form
    action="cadastrargerente.php"
    method="POST"
    enctype="multipart/form-data"
>

                <label for="nomeProduto">
                    Nome do produto
                </label>

                <input
                    type="text"
                    id="nomeProduto"
                    name="nomeProduto"
                    placeholder="Nome do produto"
                    required
                >


                <label for="valor">
                    Valor
                </label>

                <input
                    type="number"
                    id="valor"
                    name="valor"
                    step="0.01"
                    min="0"
                    placeholder="Valor"
                    required
                >


                <label for="quantidade">
                    Quantidade
                </label>

                <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    min="0"
                    placeholder="Quantidade"
                    required
                >


                <label for="prateleira">
                    Prateleira
                </label>

                <input
                    type="text"
                    id="prateleira"
                    name="prateleira"
                    placeholder="Exemplo: Prateleira A3"
                    required
                >


                <label for="imagem">
                    Imagem
                </label>

                <input
    type="file"
    name="imagem"
    accept="image/*"
    required
>


                <button type="submit">
                    CADASTRAR PRODUTO
                </button>

            </form>

        </div>

    </main>

</body>

</html>
